name: CI

on:
  pull_request:
  push:
    branches: [main]

# No secrets used: this workflow runs safely on pull requests from forks.
permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      # Actions pinned to commit SHAs, not floating tags: a tag can be moved
      # to point at new code, and this job runs against repo source.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Read the exact pnpm version from package.json; a second version conflicts.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Test
        # Redundant with `pnpm check` above (which already runs the suite) —
        # kept as its own explicit, non-continuable gate per WS-6 so a test
        # regression fails CI clearly even if `check`'s chain is ever
        # reordered. e2e:* scripts are intentionally NOT run here: they need
        # the local model stack (whisper/llama-server/Kokoro) that CI doesn't
        # have.
        if: always()
        continue-on-error: false
        run: pnpm test
