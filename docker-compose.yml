# Run Sotto self-hosted: `docker compose up -d` (see docs/self-hosting.md).
# Copy .env.example to .env first and fill in either an OpenAI key or your
# local model URLs — apps/server/src/config.ts is the source of truth for
# every variable name and default below.
services:
  sotto:
    build: .
    ports:
      - '8790:8790'
    env_file:
      - .env
    environment:
      # Bind/port inside the container. Leave these as-is unless you also
      # change the port mapping above to match.
      SOTTO_HOST: 0.0.0.0
      SOTTO_PORT: 8790
      # Passed through from .env (or the shell) rather than hardcoded here,
      # so `docker compose up` never needs a rebuild to change models/keys.
      # At least one tutor path is required: SOTTO_API_KEY with the OpenAI
      # URLs (docs/openai.md), or all three local model URLs
      # (docs/local-models.md) reachable from inside the container.
      SOTTO_API_KEY: ${SOTTO_API_KEY:-}
      # Local model services are NOT bundled in this compose file — run
      # whisper-server / llama-server / Kokoro-FastAPI yourself (on this
      # machine or elsewhere) and point these at them. From inside the
      # container, a service running on the Docker host itself (e.g. a Mac
      # running the local stack from docs/local-models.md) is reached at
      # `http://host.docker.internal:<port>/v1`, not `127.0.0.1`.
      SOTTO_STT_URL: ${SOTTO_STT_URL:-http://host.docker.internal:9001/v1}
      SOTTO_STT_MODEL: ${SOTTO_STT_MODEL:-Systran/faster-whisper-base}
      SOTTO_LLM_URL: ${SOTTO_LLM_URL:-http://host.docker.internal:8080/v1}
      SOTTO_LLM_MODEL: ${SOTTO_LLM_MODEL:-qwen3.6-35b-a3b}
      SOTTO_TTS_URL: ${SOTTO_TTS_URL:-http://host.docker.internal:8880/v1}
      SOTTO_TTS_MODEL: ${SOTTO_TTS_MODEL:-kokoro}
      # Optional `user:pass` HTTP Basic auth in front of every route except
      # /health (apps/server/src/config.ts). Unset by default — see
      # docs/self-hosting.md before exposing this beyond your own LAN.
      SOTTO_BASIC_AUTH: ${SOTTO_BASIC_AUTH:-}
    restart: unless-stopped
